# Retrofit an already-published Transistor episode to the current show-notes template
# (blank summary, keywords, written date). Inputs: the Ghost post_id and its Transistor
# episode_id. Rebuilds metadata from the Ghost post, then PATCHes the episode in place —
# it does NOT create a new episode. Safe to delete once all episodes are retrofitted.
name: Transistor — retrofit episode

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Ghost post ID of the brief"
        required: true
        type: string
      episode_id:
        description: "Transistor episode ID to update in place"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuse the pipeline's Ghost fetch: for a post that already has the audio card this
      # takes the reuse path, writing out/episode_*.txt (title / written date / url / keywords)
      # without re-patching Ghost or creating any podcast episode.
      - name: Build episode metadata from the Ghost post
        env:
          POST_ID:             ${{ github.event.inputs.post_id }}
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 scripts/generate_audio.py

      - name: Update the Transistor episode in place
        env:
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
        run: |
          pip install --quiet requests
          python3 update_transistor_episode.py \
            --episode-id "${{ github.event.inputs.episode_id }}" \
            --title "$(cat out/episode_title.txt)" \
            --date "$(cat out/episode_date.txt)" \
            --ghost-url "$(cat out/episode_url.txt)" \
            --keywords "$(cat out/episode_keywords.txt)" \
            --excerpt "$(cat out/episode_excerpt.txt)"
