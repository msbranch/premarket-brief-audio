# Temporary diagnostic — lists the Transistor shows visible to TRANSISTOR_API_KEY,
# so the correct TRANSISTOR_SHOW_ID can be confirmed. Safe to delete once resolved.
name: Transistor — list shows (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List Transistor shows
        env:
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
        run: python3 list_transistor_shows.py
