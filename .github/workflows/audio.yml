# The Tape Read — Audio pipeline
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GHOST_ADMIN_API_URL       — Ghost site URL, e.g. https://premarket-intelligence.ghost.io
#   GHOST_ADMIN_API_KEY       — Ghost Admin API key (id:secret)
#   ANTHROPIC_API_KEY         — Anthropic API key
#   ELEVENLABS_API_KEY        — ElevenLabs API key
#   ELEVENLABS_VOICE_ID       — ElevenLabs voice id
#   TRANSISTOR_API_KEY        — Transistor.fm API key (Account settings → API Key)
#   TRANSISTOR_SHOW_ID        — Transistor.fm show ID (numeric ID in dashboard URL)

name: The Tape Read — Audio

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Ghost post ID of the published brief (24-hex id from Ghost admin / the post's API id)."
        required: true
        type: string
      dry_run:
        description: "Dry run — generate the script + MP3 as artifacts, but do NOT upload or patch Ghost."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tape-read-audio-${{ github.event.inputs.post_id }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate narration + attach audio
        env:
          POST_ID:             ${{ github.event.inputs.post_id }}
          DRY_RUN:             ${{ github.event.inputs.dry_run }}
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 scripts/generate_audio.py

      - name: Publish to Transistor.fm podcast feed
        id: publish_transistor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
          TRANSISTOR_SHOW_ID: ${{ secrets.TRANSISTOR_SHOW_ID }}
        run: |
          if [ ! -f out/episode_mp3_path.txt ]; then
            echo "No episode metadata found (audio step produced no new MP3 — e.g. idempotent skip). Nothing to publish to Transistor."
            exit 0
          fi
          pip install --quiet requests
          python3 publish_to_transistor.py \
            --audio-file "$(cat out/episode_mp3_path.txt)" \
            --title "$(cat out/episode_title.txt)" \
            --date "$(cat out/episode_date.txt)" \
            --keywords "$(cat out/episode_keywords.txt)" \
            --excerpt "$(cat out/episode_excerpt.txt)" \
            --ghost-url "$(cat out/episode_url.txt)"

      - name: Publish summary
        if: ${{ steps.publish_transistor.outputs.transistor_share_url != '' }}
        run: |
          echo "- **Transistor episode published** ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Transistor share URL:** ${{ steps.publish_transistor.outputs.transistor_share_url }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload script + MP3 artifact (dry-run / debugging)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tape-read-audio
          path: out/
          if-no-files-found: ignore
          retention-days: 7
