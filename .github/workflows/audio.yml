# The Tape Read — Audio pipeline
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GHOST_ADMIN_API_URL       — Ghost site URL, e.g. https://premarket-intelligence.ghost.io
#   GHOST_ADMIN_API_KEY       — Ghost Admin API key (id:secret)
#   ANTHROPIC_API_KEY         — Anthropic API key
#   ELEVENLABS_API_KEY        — ElevenLabs API key
#   ELEVENLABS_VOICE_ID       — ElevenLabs voice id

name: The Tape Read — Audio

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Ghost post ID (24-hex). Provide this OR slug."
        required: false
        type: string
      slug:
        description: "Ghost post slug (from the post URL). Provide this OR post_id."
        required: false
        type: string
      dry_run:
        description: "Dry run — generate the script + MP3 as artifacts, but do NOT upload or patch Ghost."
        required: false
        type: boolean
        default: false
      regenerate:
        description: "Rebuild the audio even if the post already has a player (replaces the old card)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tape-read-audio-${{ github.event.inputs.post_id }}${{ github.event.inputs.slug }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate narration + attach audio
        env:
          POST_ID:             ${{ github.event.inputs.post_id }}
          SLUG:                ${{ github.event.inputs.slug }}
          DRY_RUN:             ${{ github.event.inputs.dry_run }}
          REGENERATE:          ${{ github.event.inputs.regenerate }}
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 scripts/generate_audio.py

      - name: Upload script + MP3 artifact (dry-run / debugging)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tape-read-audio
          path: out/
          if-no-files-found: ignore
          retention-days: 7
