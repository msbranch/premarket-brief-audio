# The Tape Read — Audio pipeline
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GHOST_ADMIN_API_URL       — Ghost site URL, e.g. https://premarket-intelligence.ghost.io
#   GHOST_ADMIN_API_KEY       — Ghost Admin API key (id:secret)
#   ANTHROPIC_API_KEY         — Anthropic API key
#   ELEVENLABS_API_KEY        — ElevenLabs API key
#   ELEVENLABS_VOICE_ID       — ElevenLabs voice id
#   BUZZSPROUT_PODCAST_ID     — Buzzsprout podcast ID (dashboard URL: buzzsprout.com/XXXXXX)
#   BUZZSPROUT_API_TOKEN      — Buzzsprout API token (dashboard → API Access tab)

name: The Tape Read — Audio

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Ghost post ID of the published brief (24-hex id from Ghost admin / the post's API id)."
        required: true
        type: string
      dry_run:
        description: "Dry run — generate the script + MP3 as artifacts, but do NOT upload or patch Ghost."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tape-read-audio-${{ github.event.inputs.post_id }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate narration + attach audio
        env:
          POST_ID:             ${{ github.event.inputs.post_id }}
          DRY_RUN:             ${{ github.event.inputs.dry_run }}
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python3 scripts/generate_audio.py

      - name: Install requests
        run: pip install requests

      - name: Publish to Buzzsprout podcast feed
        id: publish_buzzsprout
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          BUZZSPROUT_PODCAST_ID: ${{ secrets.BUZZSPROUT_PODCAST_ID }}
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
        run: |
          SUMMARY=$(cat out/episode_summary.txt 2>/dev/null || echo "Pre-market intelligence brief.")
          GHOST_URL=$(cat out/episode_url.txt 2>/dev/null || echo "https://thetaperead.morganbranch.co")
          TITLE=$(cat out/episode_title.txt 2>/dev/null || echo "The Tape Read")
          DATE=$(cat out/episode_date.txt 2>/dev/null || echo "")
          MP3=$(cat out/episode_mp3_path.txt 2>/dev/null || echo "")
          python3 publish_to_buzzsprout.py \
            --audio-file "$MP3" \
            --title "$TITLE" \
            --date "$DATE" \
            --summary "$SUMMARY" \
            --ghost-url "$GHOST_URL"

      - name: Publish summary
        if: ${{ steps.publish_buzzsprout.outputs.buzzsprout_audio_url != '' }}
        run: |
          echo "- **Buzzsprout episode published** ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Buzzsprout episode id:** ${{ steps.publish_buzzsprout.outputs.buzzsprout_episode_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Buzzsprout audio URL:** ${{ steps.publish_buzzsprout.outputs.buzzsprout_audio_url }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload script + MP3 artifact (dry-run / debugging)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tape-read-audio
          path: out/
          if-no-files-found: ignore
          retention-days: 7
